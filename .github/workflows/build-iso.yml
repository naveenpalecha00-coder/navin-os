name: Build NAVIN 2.1 ISO (Debian 13 Trixie)

# NAVIN 2.1 is developed on its own branch (navin-2.1, started from navin-2.0).
# navin-2.0 keeps v2.0, navin-1.2-trixie keeps v1.2 and main keeps Build 10 for rollback.
# main keeps the Debian 12 Build 10 pipeline/release and navin-1.2-trixie keeps v1.2 for rollback.
on:
  push:
    branches: [navin-2.1]
    paths: ["build-iso/**", ".github/workflows/build-iso.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-iso-2.1
  cancel-in-progress: true

env:
  ISO: navin-2.1-x86_64.iso
  TAG: v2.1-test
  FINAL_TAG: v2.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Unit tests (hardware detection, shortcuts, rules)
        run: python3 -m unittest discover -s build-iso/tests -v

      - name: GUI smoke test on Debian 13 (System Center, App Store, Flathub, shortcut editor, Toolbox)
        run: |
          sudo docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work debian:trixie bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xauth python3-gi gir1.2-gtk-3.0 python3-psutil python3-xlib xfconf dbus-x11 pciutils usbutils >/dev/null
            L=build-iso/config/includes.chroot/usr/local/lib/navin
            mkdir -p /usr/local/lib/navin && cp -a $L/. /usr/local/lib/navin/
            cp -a build-iso/config/includes.chroot/usr/local/bin/. /usr/local/bin/
            mkdir -p /usr/share/navin && cp -a build-iso/config/includes.chroot/usr/share/navin/. /usr/share/navin/
            mkdir -p /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml && cp build-iso/config/includes.chroot/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/*.xml /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/
            fail=0
            for app in "navin_install_guide.py -" "navin_center.py whatsnew" "navin_center.py laptop" "navin_center.py fan" "navin_center.py hardware" "navin_center.py monitor" "navin_center.py updates" "navin_desktop.py store" "navin_desktop.py flathub" "navin_desktop.py fan" "navin_desktop.py controls" "navin_desktop.py devices" "navin_desktop.py display" "navin_desktop.py search"; do
              set -- $app
              rc=0; a=$2; [ "$a" = - ] && a=; timeout 12 xvfb-run -a dbus-launch python3 /usr/local/lib/navin/$1 $a > /tmp/out 2>&1 || rc=$?
              if [ $rc -ne 124 ] || grep -q Traceback /tmp/out; then echo "FAIL $app (exit $rc)"; cat /tmp/out; fail=1; else echo "ok   $app"; fi
            done
            rc=0; timeout 12 xvfb-run -a dbus-launch python3 /usr/local/bin/navin-shortcuts > /tmp/out 2>&1 || rc=$?
            if [ $rc -ne 124 ] || grep -q Traceback /tmp/out; then echo "FAIL navin-shortcuts"; cat /tmp/out; fail=1; else echo "ok   navin-shortcuts"; fi
            # NAVIN 2.1 Toolbox: one tool page per input type (folder+text, multi-file+save, file+choice, no inputs)
            for t in large pdfmerge pdfsmall report; do
              rc=0; timeout 12 xvfb-run -a dbus-launch python3 /usr/local/bin/navin-toolbox $t > /tmp/out 2>&1 || rc=$?
              if [ $rc -ne 124 ] || grep -q Traceback /tmp/out; then echo "FAIL navin-toolbox $t (exit $rc)"; cat /tmp/out; fail=1; else echo "ok   navin-toolbox $t"; fi
            done
            exit $fail'

      - name: Check every package against the Debian 13 archive
        run: python3 build-iso/tools/check-packages.py | tee build-iso/package-check.md

      - name: Build ISO in Debian 13 container
        run: |
          sudo docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" -w /work/build-iso \
            debian:trixie bash ./build.sh

      - name: Verify ISO, size and Secure Boot chain
        id: verify
        run: |
          cd build-iso
          test -f "$ISO"
          sha256sum -c "$ISO.sha256"
          SIZE=$(stat -c %s "$ISO")
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 "$ISO.sha256")" >> "$GITHUB_OUTPUT"
          if [ "$SIZE" -gt 2147000000 ]; then echo "ISO larger than GitHub's 2 GiB asset limit"; exit 1; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq xorriso qemu-system-x86 ovmf socat imagemagick mtools dosfstools >/dev/null
          xorriso -osirrox on -indev "$ISO" -extract /EFI/boot/bootx64.efi /tmp/bootx64.efi 2>/dev/null || true
          if strings /tmp/bootx64.efi 2>/dev/null | grep -qi 'shim'; then echo "secureboot=shim (Microsoft-signed)" >> "$GITHUB_OUTPUT"; else echo "secureboot=not signed" >> "$GITHUB_OUTPUT"; fi
          xorriso -indev "$ISO" -find /live -name 'vmlinuz*' 2>/dev/null | tee /tmp/kernels.txt
          echo "kernel=$(basename $(head -1 /tmp/kernels.txt | tr -d "'") )" >> "$GITHUB_OUTPUT"

      - name: VM tests — live boot (BIOS 2 GB, UEFI 4 GB, Secure Boot), installer + install to disk + reboot (Secure Boot UEFI, BIOS)
        id: boot
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo rm -rf build-iso/chroot build-iso/binary build-iso/cache   # free disk for the install-test disks
          df -h /
          bash build-iso/tools/vm-boot-test.sh "build-iso/$ISO" vm-test
          cat vm-test/results.env
          cat vm-test/results.env >> "$GITHUB_OUTPUT"

      - name: Build report
        run: |
          sudo chown -R "$(id -u):$(id -g)" build-iso
          B=build-iso; R=$B/reports; mkdir -p $R
          cp $B/docs/hardware-compatibility.md $B/docs/known-issues.md $R/
          {
            echo "# NAVIN 2.1 — Debian 13 Trixie build report"
            echo
            echo "- Commit: $GITHUB_SHA · Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- ISO: $ISO · $(( ${{ steps.verify.outputs.size }} / 1048576 )) MB · SHA256 ${{ steps.verify.outputs.sha }}"
            echo "- Base: $(cat $R/base.txt 2>/dev/null)"
            echo "- Live kernel: ${{ steps.verify.outputs.kernel }} · UEFI loader: ${{ steps.verify.outputs.secureboot }}"
            echo "- Packages in image: $(wc -l < $R/package-manifest.tsv 2>/dev/null)"
            echo "- Optional packages missing: $(tr '\n' ' ' < $R/missing-optional.txt 2>/dev/null)"
            echo
            echo "## Virtual-machine boot tests (automatic)"
            echo "| Machine | Result | Seconds | Details |"
            echo "|---|---|---|---|"
            echo "| Legacy BIOS, 2 GB | ${{ steps.boot.outputs.result_bios_2g }} | ${{ steps.boot.outputs.time_bios_2g }} | ${{ steps.boot.outputs.detail_bios_2g }} |"
            echo "| UEFI, 4 GB | ${{ steps.boot.outputs.result_uefi_4g }} | ${{ steps.boot.outputs.time_uefi_4g }} | ${{ steps.boot.outputs.detail_uefi_4g }} |"
            echo "| UEFI Secure Boot | ${{ steps.boot.outputs.result_uefi_sb }} | ${{ steps.boot.outputs.time_uefi_sb }} | ${{ steps.boot.outputs.detail_uefi_sb }} |"
            echo
            echo "## Automatic install tests (offline, blank virtual disk)"
            echo "Calamares window opened in the Secure Boot live session (screenshot in the build evidence), then the"
            echo "Calamares install steps ran through NAVIN's own helpers; the installed disk was started alone."
            echo "| Test | Result | Seconds | Details |"
            echo "|---|---|---|---|"
            echo "| Install, UEFI Secure Boot | ${{ steps.boot.outputs.result_install_sb }} | ${{ steps.boot.outputs.time_install_sb }} | ${{ steps.boot.outputs.detail_install_sb }} |"
            echo "| Start installed disk, Secure Boot, empty boot entries | ${{ steps.boot.outputs.result_boot_installed_sb }} | ${{ steps.boot.outputs.time_boot_installed_sb }} | ${{ steps.boot.outputs.detail_boot_installed_sb }} |"
            echo "| Install, legacy BIOS | ${{ steps.boot.outputs.result_install_bios }} | ${{ steps.boot.outputs.time_install_bios }} | ${{ steps.boot.outputs.detail_install_bios }} |"
            echo "| Start installed disk, legacy BIOS | ${{ steps.boot.outputs.result_boot_installed_bios }} | ${{ steps.boot.outputs.time_boot_installed_bios }} | ${{ steps.boot.outputs.detail_boot_installed_bios }} |"
            echo
            echo "## Quality gates still requiring real hardware (not done by this pipeline)"
            echo "- [ ] Calamares install clicked through by a person on a real PC (with and without Windows) and the installed system boots"
            echo "- [ ] Touchpad (Synaptics / ELAN / ALPS / I2C-HID) on real laptops, including Samsung RV411 (Live Mode and installed, no commands)"
            echo "- [ ] Fan slider on a laptop with real fan control (ThinkPad / hwmon PWM); CPU heat limit on laptops without it"
            echo "- [ ] Boot time on the target laptop (goal ~10 s on SSD; hard disks are slower)"
            echo "- [ ] Wi-Fi, Bluetooth and audio on test hardware"
            echo "- [ ] Intel / AMD / NVIDIA graphics on real GPUs; fan control on supported laptops"
            echo "- [ ] Long-duration stability (navin-benchmark run --stability 60)"
            echo "- [ ] APT, Flatpak and known-compatible EXE installs"
            echo
            cat $B/package-check.md
          } > $R/build-report.md
          cat $R/build-report.md

      - name: Upload logs, screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navin-2.1-build-evidence
          path: |
            build-iso/build.log
            build-iso/reports/
            vm-test/
          if-no-files-found: ignore

      - name: Keep ISO as a workflow artifact (7 days) even if a gate fails
        if: always() && steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: navin-2.1-iso
          path: |
            build-iso/navin-2.1-x86_64.iso
            build-iso/navin-2.1-x86_64.iso.sha256
          retention-days: 7
          compression-level: 0

      - name: Decide release type
        id: gate
        run: |
          o='${{ toJSON(steps.boot.outputs) }}'
          final=yes
          for k in result_bios_2g result_uefi_4g result_uefi_sb result_install_sb result_boot_installed_sb result_install_bios result_boot_installed_bios; do
            v=$(echo "$o" | python3 -c "import json,sys; print(json.load(sys.stdin).get('$k',''))")
            echo "$k=$v"; [ "$v" = pass ] || final=no
          done
          echo "final=$final" >> "$GITHUB_OUTPUT"

      - name: Publish NAVIN 2.1 release (only when every live, install and reboot VM test passes)
        if: steps.gate.outputs.final == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FINAL_TAG }}
          target_commitish: ${{ github.sha }}
          name: NAVIN 2.1 (Debian 13)
          prerelease: false
          make_latest: false
          body: |
            NAVIN 2.1 — Debian 13 Trixie base, x86_64 hybrid ISO (UEFI + Secure Boot + legacy BIOS).
            Boot menu with two choices: Live Mode and Full Installation. Both include the touchpad controller fix,
            so old-laptop touchpads (Samsung RV411 class) work without typing commands. Lighter background service,
            NAVIN Toolbox (files, PDF, images, video, audio, network, system tools), Ctrl+Alt+Del screen, Windows-style
            desktop shortcuts. Everything from 2.0 is kept. Full list: System Center → What's New.

            SHA256: ${{ steps.verify.outputs.sha }}

            Automatic tests passed in virtual machines:
            - Live boot: legacy BIOS 2 GB, UEFI 4 GB, UEFI Secure Boot
            - Installer window opens; offline install to an empty disk with Secure Boot UEFI and with legacy BIOS
            - Installed disk starts on its own (Secure Boot with empty boot entries, and BIOS) to the desktop, live-only admin rules removed

            Not yet confirmed on physical computers (touchpads, Wi-Fi, sound, graphics cards, fans, long runs).
            Please report problems on GitHub Issues. NAVIN 2.0, 1.2 and Build 10 (Debian 12) stay available for rollback.
            See build-report.md, known-issues.md and hardware-compatibility.md.
          files: |
            build-iso/navin-2.1-x86_64.iso
            build-iso/navin-2.1-x86_64.iso.sha256
            build-iso/reports/build-report.md
            build-iso/reports/package-manifest.tsv
            build-iso/reports/hardware-compatibility.md
            build-iso/reports/known-issues.md

      - name: Publish TEST pre-release (live boots passed but an install test did not)
        if: steps.gate.outputs.final != 'yes' && steps.boot.outputs.result_bios_2g == 'pass' && steps.boot.outputs.result_uefi_4g == 'pass'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: NAVIN 2.1 Debian 13 — TEST BUILD (not hardware-verified)
          prerelease: true
          make_latest: false
          body: |
            NAVIN 2.1 — Debian 13 Trixie base, x86_64 hybrid ISO (UEFI + legacy BIOS). Development build.

            SHA256: ${{ steps.verify.outputs.sha }}

            Status: [Build Passed] · [VM boot: BIOS ${{ steps.boot.outputs.result_bios_2g }}, UEFI ${{ steps.boot.outputs.result_uefi_4g }}, Secure Boot ${{ steps.boot.outputs.result_uefi_sb }}] · [Install: Secure Boot ${{ steps.boot.outputs.result_install_sb }}/${{ steps.boot.outputs.result_boot_installed_sb }}, BIOS ${{ steps.boot.outputs.result_install_bios }}/${{ steps.boot.outputs.result_boot_installed_bios }}]
            NOT the final release. Keep using Build 10 (Debian 12) for daily use; it stays available for rollback.
            See build-report.md, known-issues.md and hardware-compatibility.md.
          files: |
            build-iso/navin-2.1-x86_64.iso
            build-iso/navin-2.1-x86_64.iso.sha256
            build-iso/reports/build-report.md
            build-iso/reports/package-manifest.tsv
            build-iso/reports/hardware-compatibility.md
            build-iso/reports/known-issues.md
