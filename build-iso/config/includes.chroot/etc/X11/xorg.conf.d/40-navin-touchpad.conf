# NAVIN OS Build 9: smooth touchpad (libinput), palm rejection, no typing freeze
Section "InputClass"
  Identifier "NAVIN touchpad"
  MatchIsTouchpad "on"
  MatchDevicePath "/dev/input/event*"
  Driver "libinput"
  Option "Tapping" "on"
  Option "TappingButtonMap" "lrm"
  Option "TappingDrag" "on"
  Option "TappingDragLock" "off"
  Option "NaturalScrolling" "true"
  Option "ScrollMethod" "twofinger"
  Option "HorizontalScrolling" "true"
  Option "ClickMethod" "clickfinger"
  Option "DisableWhileTyping" "off"
  Option "AccelProfile" "adaptive"
  Option "AccelSpeed" "0.25"
  Option "MiddleEmulation" "on"
EndSection
Section "InputClass"
  Identifier "NAVIN pointer"
  MatchIsPointer "on"
  MatchDevicePath "/dev/input/event*"
  Driver "libinput"
  Option "AccelProfile" "adaptive"
EndSection
Section "InputClass"
  Identifier "NAVIN keyboard"
  MatchIsKeyboard "on"
  MatchDevicePath "/dev/input/event*"
  Driver "libinput"
EndSection
