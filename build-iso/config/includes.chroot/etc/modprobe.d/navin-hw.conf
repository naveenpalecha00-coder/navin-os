# NAVIN 2.0 hardware options.
# psmouse: no forced InterTouch/SMBus. The kernel already switches the Synaptics/Elantech touchpads it
# knows to SMBus; forcing it on older laptops (Samsung RV411 class) makes the touchpad stop or stutter.
# Laptops that need it get it from navin-hwdetect's suggestion in Driver Manager.
# i915: framebuffer compression and panel self refresh stay at kernel defaults (forced FBC caused
# screen freezes on 1st-gen Intel graphics).
