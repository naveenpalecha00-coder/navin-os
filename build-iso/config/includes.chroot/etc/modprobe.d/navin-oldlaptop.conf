# NAVIN 2.0: older laptops
# No PC-speaker beeps and no hardware watchdogs that reset slow old machines during heavy disk work.
blacklist pcspkr
blacklist iTCO_wdt
blacklist sp5100_tco
# Intel HD Audio: no power-saving clicks/pops and no audio dropouts on old codecs.
options snd_hda_intel power_save=0 power_save_controller=N
