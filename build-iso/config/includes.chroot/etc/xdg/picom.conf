# NAVIN OS 1.0 compositor: soft shadows, rounded corners, gentle fades
backend = "xrender";
vsync = true;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.18;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-exclude = [ "name = 'Notification'", "class_g = 'Xfce4-panel'", "class_g = 'Xfdesktop'", "_GTK_FRAME_EXTENTS@:c" ];

corner-radius = 12;
rounded-corners-exclude = [ "class_g = 'Xfce4-panel'", "class_g = 'Xfdesktop'", "window_type = 'dock'", "window_type = 'desktop'" ];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

inactive-opacity = 1.0;
active-opacity = 1.0;
mark-wmwin-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;

wintypes: {
  tooltip = { fade = true; shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { shadow = true; };
  dropdown_menu = { shadow = true; };
};
