# NAVIN OS Build 9 compositor: smooth 60 FPS on Intel/AMD iGPUs
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
unredir-if-possible = true;
xrender-sync-fence = true;

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.16;
shadow-offset-x = -10;
shadow-offset-y = -8;
shadow-exclude = [ "name = 'Notification'", "class_g = 'Xfce4-panel'", "class_g = 'Xfdesktop'", "_GTK_FRAME_EXTENTS@:c", "window_type = 'menu'", "window_type = 'dropdown_menu'", "window_type = 'popup_menu'" ];

corner-radius = 10;
rounded-corners-exclude = [ "class_g = 'Xfce4-panel'", "class_g = 'Xfdesktop'", "window_type = 'dock'", "window_type = 'desktop'" ];

fading = true;
fade-in-step = 0.12;
fade-out-step = 0.12;
fade-delta = 5;
no-fading-openclose = false;

inactive-opacity = 1.0;
active-opacity = 1.0;
mark-wmwin-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

wintypes: {
  tooltip = { fade = true; shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { shadow = false; fade = false; };
  dropdown_menu = { shadow = false; fade = false; };
};
