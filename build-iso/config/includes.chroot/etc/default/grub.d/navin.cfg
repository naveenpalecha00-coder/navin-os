# NAVIN 2.0 boot menu on installed systems (read after /etc/default/grub).
GRUB_DISTRIBUTOR="NAVIN OS"
# 3 s: fast start, still enough time to pick Windows on dual-boot computers.
GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu
GRUB_RECORDFAIL_TIMEOUT=3
# Fast quiet boot: fewer console messages, no wait for the journal to flush to slow disks.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 systemd.show_status=auto"
# Dual boot: list Windows and other systems found by os-prober.
GRUB_DISABLE_OS_PROBER=false
