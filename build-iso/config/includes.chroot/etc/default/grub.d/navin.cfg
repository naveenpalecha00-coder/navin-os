# NAVIN 2.1 boot menu on installed systems (read after /etc/default/grub).
GRUB_DISTRIBUTOR="NAVIN OS"
# 3 s: fast start, still enough time to pick Windows on dual-boot computers.
GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu
GRUB_RECORDFAIL_TIMEOUT=3
# NAVIN 2.1: i8042.nomux/reset on every computer so PS/2 touchpads (Samsung RV411 and other old laptops)
# work from the first boot without any command. Harmless on laptops without that controller.
# Fast quiet boot: fewer console messages, no wait for the journal to flush to slow disks.
GRUB_CMDLINE_LINUX_DEFAULT="i8042.nomux=1 i8042.reset=1 quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 systemd.show_status=auto"
# Dual boot: list Windows and other systems found by os-prober.
GRUB_DISABLE_OS_PROBER=false
