<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; media-src blob: data:; connect-src 'none';"><title>NAVIN AI</title><link rel="stylesheet" href="app.css"></head><body>
<header><div class="brand">N<span>NAVIN AI</span><small>BUILD 8</small></div><select id="model" aria-label="Model"><option>navin-1</option></select><button id="discover" title="Refresh models">↻</button></header>
<nav><button data-tab="chat" class="active">Chat</button><button data-tab="voice">Voice</button><button data-tab="images">Images</button><button data-tab="playground">Developer API</button></nav>
<main><section id="chat" class="active"><div id="messages" aria-live="polite"><div class="greeting"><h1>Namaste. What’s on your mind?</h1><p>नमस्ते · Hindi / English</p></div></div><div class="compose"><textarea id="prompt" placeholder="Ask NAVIN AI…" rows="2"></textarea><button id="record" title="Microphone">●</button><button id="send" title="Send">↑</button></div><div class="actions"><button id="regenerate">↻ Regenerate</button><button id="local">⚙ Run local action</button><span id="wave" hidden>▂ ▅ ▇ ▅ ▂ Recording…</span></div></section>
<section id="voice"><h1>Speak it into life</h1><textarea id="speech-text" placeholder="Text to read aloud…" rows="6"></textarea><label>Voice <select id="voice-select"><option>Kore</option><option>Puck</option><option>Charon</option><option>Aoede</option><option>Fenrir</option><option>Leda</option></select></label><button id="speak">▶ Generate speech</button><audio id="audio" controls></audio></section>
<section id="images"><h1>A picture from your imagination</h1><textarea id="image-prompt" placeholder="Describe an image…" rows="3"></textarea><select id="image-size"><option>1024x1024</option><option>1536x1024</option></select><button id="generate">✦ Generate image</button><img id="generated" alt="Generated image" hidden><button id="wallpaper" disabled>Set as Desktop Wallpaper</button></section>
<section id="playground"><h1>Developer API playground</h1><select id="endpoint"><option value="chat">Chat completions</option><option value="models">Models</option><option value="speech">Text to speech</option><option value="image">Image generation</option><option value="transcribe">Transcription</option></select><textarea id="payload" rows="8" aria-label="Request JSON"></textarea><button id="test-api">▶ Send request</button><select id="language"><option>cURL</option><option>JavaScript</option><option>Python</option></select><button id="copy-code">Copy code</button><pre id="code"></pre><pre id="response"></pre></section></main><footer id="status" role="status">NAVIN AI · Navin Palecha</footer><script src="app.js"></script></body></html>
