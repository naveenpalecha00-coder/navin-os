# NAVIN OS 1.2 installer welcome page: same checks as Debian 13, NAVIN limits.
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true
requirements:
    requiredStorage:    20
    requiredRam:        1.5
    internetCheckUrl:   http://deb.debian.org
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - storage
        - ram
        - root
